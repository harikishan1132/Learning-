<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>

<body>
    <h1>Events</h1>
    <hr>
    <h2>coding contest</h2>
    <p>solve 5 problems in 2 hours </p>
    <h2>Web design challenge </h2>
    <p>design using html</p>
    <h2>SCHEDULE</h2>

    <table border="1">
        <caption>Events Schedule</caption>
        <!-- 1st row-->
        <tr>
            <th rowspan="2">Day</th>
            <th colspan="2">Time</th>
            <th colspan="2" rowspan="2">Events</th>

        </tr>
        <tr>
            <th>Start</th>
            <th>End</th>
        </tr>
        <tr>
            <th rowspan="2">Day1</th>
            <th>10:00am</th>
            <th>12:00pm</th>
            <th>coding contest</th>
        </tr>
        <tr>
            <th>3:00pm</th>
            <th>4:00pm</th>
            <th>Web design</th>
        </tr>
    </table>

</body>

</html>
